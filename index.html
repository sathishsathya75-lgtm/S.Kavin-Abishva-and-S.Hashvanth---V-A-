<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Eclipse AR Explorer</title><script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script><script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script><style>body{margin:0;font-family:system-ui,Arial;background:#08152c;color:white}#controls{position:fixed;z-index:20;left:10px;right:10px;bottom:15px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}button{border:2px solid #fff7;border-radius:24px;padding:13px 16px;font-weight:800;color:white;background:#1767be;font-size:15px}button.active{background:#ed8a16}#intro{position:fixed;top:10px;left:10px;right:10px;z-index:20;background:#06142bdc;padding:12px;border-radius:12px;text-align:center;font-size:14px}#status{display:block;color:#fbd276;font-weight:700;margin-top:4px}a{color:#9ee6ff}</style><script>
AFRAME.registerComponent('eclipse-demo',{init:function(){this.mode='solar';this.phase=0;this.moon=this.el.querySelector('#moon');this.earth=this.el.querySelector('#earth');this.shadow=this.el.querySelector('#shadow');this.moonLabel=this.el.querySelector('#moonlabel');},tick:function(t,dt){if(!this.moon)return;this.phase+=Math.min(dt||0,100)*.00035;let x=this.mode==='solar'?-0.32:0.32;let y=.12*Math.sin(this.phase);this.moon.setAttribute('position',`${x} ${y} 0`);this.moonLabel.setAttribute('position',`${x} ${y+.18} 0`);this.shadow.setAttribute('visible',Math.abs(y)<.055);this.shadow.setAttribute('position',this.mode==='solar'?'0 0 0':'0.48 0 0');},setMode:function(mode){this.mode=mode;this.phase=0;}});
function choose(mode){let e=document.querySelector('#system');if(e&&e.components['eclipse-demo'])e.components['eclipse-demo'].setMode(mode);document.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));document.querySelector('#status').textContent=mode==='solar'?'SOLAR: Moon between Sun and Earth':'LUNAR: Earth between Sun and Moon';}
</script></head><body><div id="intro"><strong>🌞 ECLIPSE AR EXPLORER 🌙</strong><span id="status">SOLAR: Moon between Sun and Earth</span>Allow camera access, then point at the printed HIRO marker. This is a simplified 3D demonstration, not a scale model.</div><div id="controls"><button data-mode="solar" class="active" onclick="choose('solar')">☀️ Solar eclipse</button><button data-mode="lunar" onclick="choose('lunar')">🌕 Lunar eclipse</button></div><a-scene embedded vr-mode-ui="enabled:false" renderer="logarithmicDepthBuffer:true;antialias:true" arjs="sourceType:webcam;debugUIEnabled:false;trackingMethod:best;" device-orientation-permission-ui="enabled:false"><a-marker preset="hiro" emitevents="true"><a-entity id="system" eclipse-demo position="0 0.25 0" rotation="-90 0 0" scale="1 1 1"><a-sphere position="-0.67 0 0" radius="0.19" material="color:#ffae00;emissive:#ff9100;emissiveIntensity:1"></a-sphere><a-light type="point" color="#ffefc2" intensity="2" position="-0.67 0 .2"></a-light><a-sphere id="earth" position="0 0 0" radius="0.145" material="color:#1685dc;roughness:0.9"></a-sphere><a-sphere position="0 .02 .105" radius="0.065" material="color:#42b86b;roughness:1"></a-sphere><a-sphere id="moon" position="-.32 0 0" radius="0.072" material="color:#bbbcc7;roughness:1"></a-sphere><a-sphere id="shadow" position="0 0 0" radius="0.045" material="color:#0a1023;opacity:.7;transparent:true" visible="true"></a-sphere><a-text value="SUN" color="white" align="center" width="1.2" position="-.67 -.32 0"></a-text><a-text value="EARTH" color="white" align="center" width="1.2" position="0 -.32 0"></a-text><a-text id="moonlabel" value="MOON" color="white" align="center" width="1.1" position="-.32 .18 0"></a-text><a-ring radius-inner=".31" radius-outer=".315" material="color:#69d3f9;opacity:.6;transparent:true;side:double" rotation="0 0 0"></a-ring></a-entity></a-marker><a-entity camera></a-entity></a-scene></body></html>
